name: test

on:
  push:
  pull_request:

# Linux pytest 保留。macos-15 只编现有 LogBridge scheme，并跑同一套 pytest。
# 现有 CALayer.colorspace 在 Xcode 26 / macOS 26 SDK 才进公开头；本机默认 Xcode 16.4 编不过。
# 下面会 xcode-select 到已装的 Xcode 26。不改预览代码。
# Metal GPU、Finder 显示、真机写出 / 真机导出 在 Actions 上测不了，仍靠人在 Mac 上点。
# 没有真机 CI，也不覆盖 Metal / Finder / 真写出。

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy pytest
      - name: Test
        run: python -m pytest -q

  macos:
    runs-on: macos-15
    # 编 macos/LogBridge 现有 scheme；pytest 依赖与上面 Linux job 相同（numpy pytest）。
    # Metal GPU、Finder 显示、真机写出 / 真机导出 仍靠人在 Mac 上点。没有真机 CI。
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        # CALayer.colorspace 要 Xcode 26。不改预览。Metal / Finder / 真写出仍靠人工。
        run: |
          XCODE26=""
          for app in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app \
            /Applications/Xcode_26.app
          do
            if [ -d "$app" ]; then
              XCODE26="$app"
              break
            fi
          done
          if [ -z "$XCODE26" ]; then
            echo "需要 Xcode 26（CALayer.colorspace）。这台 runner 没有。"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE26/Contents/Developer"
          xcodebuild -version
      - name: Compile LogBridge scheme
        working-directory: macos/LogBridge
        run: |
          xcodebuild \
            -project LogBridge.xcodeproj \
            -scheme LogBridge \
            -destination 'generic/platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install numpy pytest
      - name: Test
        run: python -m pytest -q
